; supervisord.conf — polymarket-arb-bot process management
;
; Usage:
;   pip install supervisor
;   supervisord -c supervisord.conf          # start in background
;   supervisorctl -c supervisord.conf status # check status
;   supervisorctl -c supervisord.conf stop poly-arb-bot
;   supervisorctl -c supervisord.conf tail -f poly-arb-bot stderr
;
; The bot is auto-restarted on non-zero exit with exponential backoff up to
; 60 seconds between attempts.  A 5-minute (300 s) startretries budget means
; the bot can crash-loop during bad market hours and still recover.
;
; Adjust `command`, `directory`, and `environment` to match your deployment.

[unix_http_server]
file=/tmp/poly-arb-supervisord.sock

[supervisord]
logfile=logs/supervisord.log
logfile_maxbytes=20MB
logfile_backups=5
loglevel=info
pidfile=/tmp/poly-arb-supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/poly-arb-supervisord.sock

[program:poly-arb-bot]
; ── Core command ─────────────────────────────────────────────────────────────
command=python -m src.main paper-arb-sim
    --execution-mode paper
    --book-source websocket
    --budget 10000
    --max-trade-size 10000
    --max-total-locked-capital 10000
    --enable-n-leg-trading
    --dashboard-interval-seconds 1
    --report-interval-seconds 10
    --scan-log-interval-seconds 1
    --out reports/bot_sim.csv
    --trades-out reports/bot_trades.csv
    --save-markdown reports/bot_sim.md

; Adjust these to match your checked-out project root:
directory=/path/to/Polybitrage

; ── Restart policy ───────────────────────────────────────────────────────────
autostart=true
autorestart=true
startretries=10
startsecs=5             ; must stay up for 5 s to count as "started"

; Exponential backoff between crashes (supervisor does not do this natively,
; but the default 1 s delay grows each try up to the OS scheduler limit).
; For finer backoff, replace `command` with a wrapper shell script that
; calls `sleep $((RESTART_COUNT * 5))` before exec-ing the bot.

; ── Logging ──────────────────────────────────────────────────────────────────
stdout_logfile=logs/poly-arb-bot.stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=logs/poly-arb-bot.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
redirect_stderr=false   ; keep stdout and stderr separate

; ── Environment ──────────────────────────────────────────────────────────────
; Add any secrets as environment variables here (or use a .env loader).
; environment=SOME_API_KEY="%(ENV_SOME_API_KEY)s"

; ── Graceful shutdown ─────────────────────────────────────────────────────────
stopsignal=SIGTERM
stopwaitsecs=15         ; give the bot 15 s to flush audit data and close WS
